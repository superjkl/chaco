[build-system]
requires = ["cython", "numpy>=2.0.0", "setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
skip = "pp* *-manylinux_i686 *_ppc64le *_s390x *-musllinux*"

[tool.cibuildwheel.macos]
archs = "x86_64 universal2"

[tool.cibuildwheel.linux]
archs = 'x86_64 aarch64'

[project]
dynamic = ["version", "optional-dependencies", "license", "authors", "description", "maintainers", "readme", "dependencies", "entry-points", "classifiers"]
name = "chaco"
